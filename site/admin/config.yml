# =============================================================================
# Sveltia CMS — Little Princess Designer
#
# Editors sign in with their GitHub account (see docs/CMS-SETUP.md). Sveltia is
# a drop-in successor to Decap CMS and reads this same config file.
#
# Editing a product here commits a JSON file to content/products/, which makes
# Netlify rebuild the site. Changes are live in a minute or two.
# =============================================================================

backend:
  name: github
  # Where the repository actually lives. It moved from the Somaz137 account to
  # the littleprincessdesigner organisation; GitHub forwards the old address,
  # but this line must name the current one.
  repo: littleprincessdesigner/little-princess-designer2
  branch: main
  # How the "Sign in with GitHub" button reaches GitHub. Left unset, Sveltia
  # uses Netlify's shared OAuth service, which needs the GitHub provider added
  # under the Netlify site's settings (docs/CMS-SETUP.md, step 3). If that
  # option is missing from Netlify, deploy the small sveltia-cms-auth worker on
  # Cloudflare (free) and point this at it instead:
  #   base_url: https://YOUR-WORKER.workers.dev

  # Each save is now committed by the editor's own GitHub account, so GitHub
  # records who made every change. These lines just keep the wording readable in
  # the history; {{author-name}} and {{author-login}} come from GitHub.
  commit_messages:
    create: 'Create {{collection}} “{{slug}}” — {{author-name}}'
    update: 'Update {{collection}} “{{slug}}” — {{author-name}}'
    delete: 'Delete {{collection}} “{{slug}}” — {{author-name}}'
    uploadMedia: 'Upload “{{path}}” — {{author-name}}'
    deleteMedia: 'Delete “{{path}}” — {{author-name}}'

# Edits publish straight away. Turn on the draft/review workflow later if you
# ever want a second pair of eyes before things go live:
#   publish_mode: editorial_workflow
publish_mode: simple

# Sveltia still requires both keys to be declared even though no photo is
# committed into this repository — every photo is a web address pasted into the
# form (see the Photos field below). This folder is not used.
media_folder: "site/assets/uploads"
public_folder: "/assets/uploads"

# --- Photos ------------------------------------------------------------------
# Photos are NOT stored in this repository. Each photo row on a product takes a
# web address, pasted in by the editor from the shop's ImageKit library
# (imagekit.io → click the photo → Copy URL). That keeps camera-sized files out
# of git history and lets ImageKit resize them for phones on delivery — the
# wiring for that resize lives in tools/images.js.
#
# Sveltia CMS does not support ImageKit's in-page picker (it ignores custom
# media libraries), which is why the picker button is now a plain address box.
# The three hero sketch/colour/photo images stay as repo files either way —
# they are part of the page design, not catalogue content.

# Where the "back to site" link in the admin points.
site_url: https://littleprincessdesigner.pk
# The shop's own lockup in the CMS header, already sitting in site/assets so it
# needs no third-party request.
logo_url: /assets/logo-lockup.webp

collections:

  # ---------------------------------------------------------------------------
  # PRODUCTS — add, price, describe, photograph, hide
  # ---------------------------------------------------------------------------
  - name: products
    label: Products
    label_singular: Product
    description: >
      Every piece in the shop. A product needs a name, a subcategory, at least
      one size with a price, and ideally a photo. Turn "Show on website" off to
      take a piece down without deleting it.
    folder: content/products
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: name
    slug: "{{slug}}"
    # Every row shows name, section, price and any warning marker, so the list
    # can be read without opening anything.
    #
    #   Blush Party Frock  ·  girls-luxury-dresses  ·  PKR 18500  ·  HIDDEN
    #
    # Two things to know about it:
    #
    #   · The section shows as the stored code, not as "Girls / Party" — the
    #     summary only sees what is in the file, not what a relation points at.
    #     Since the code became the section's file name that reads for itself
    #     ("girls-luxury-dresses"), where it used to read "g3".
    #   · The price is the FIRST size row's price, not the lowest. The website
    #     shows the lowest ("from PKR …"); a summary cannot compare rows. If a
    #     row's price looks wrong here, open it and check which row is first.
    #
    # `ternary('a','b')` prints a when the field is set and b when it is not,
    # which is how HIDDEN appears only on hidden pieces. Sveltia's string
    # transformations are upper, lower, slugify, truncate, default, ternary and
    # date — nothing else parses.
    summary: "{{name}}  ·  {{subcategory}}  ·  PKR {{sizes.0.price | default('?')}}{{visible | ternary('', '  ·  HIDDEN')}}{{badge | ternary('  ·  ', '')}}{{badge | upper}}"
    sortable_fields: [name, addedOn, subcategory]
    # The photo the grid/tiles view shows. It points at the hidden "image" field
    # that site/admin/tile-photo.js keeps in sync with the first Photos row on
    # every save (photo fields are plain address boxes now, which the CMS does
    # not recognise as pictures on their own).
    thumbnail: image
    # Preview pane OFF (2026-08-30). site/admin/preview.js draws the real
    # product page — the same tools/card.js the live site is built with — but
    # under Sveltia the pane was destabilising the editor form: adding a row to
    # Photos or Sizes was wiping the entry. Turned off until the custom preview
    # is debugged against Sveltia in a real browser. Everything else works with
    # it off; flip back to true to re-test. preview.js and its <script> tags in
    # index.html are left in place so re-enabling is a one-line change.
    editor:
      preview: true
    view_filters:
      - label: "Live on the website"
        field: visible
        pattern: true
      - label: "Hidden"
        field: visible
        pattern: false
      - label: "Sold out"
        field: badge
        pattern: "Sold out"
      # Photo filters. A filter matches a field's value as text, so these read
      # the whole Photos list at once and ask whether a real image address
      # (https://…) appears anywhere in it. That is the only form that catches
      # both a piece with no photo rows at all and a piece whose rows are still
      # blank; a filter on the first row's link misses the first case, because a
      # field that does not exist never matches.
      # Single-quoted deliberately: a double-quoted YAML scalar turns \\s into \s
      # on the way in, so the pattern would have to be written with doubled
      # backslashes and would then read differently to tools/yaml.js, which does
      # not process escapes. Single quotes mean both parsers see the same text.
      - label: "No photo yet"
        field: images
        pattern: '^(?![\s\S]*(https?://|/assets/uploads/))[\s\S]*$'
      - label: "Photo added"
        field: images
        pattern: '(https?://|/assets/uploads/)'
    view_groups:
      - label: "Subcategory"
        field: subcategory
    fields:
      - label: "Product name"
        name: name
        widget: string
        hint: "Shown on the card and the product page. This also sets the web address, so avoid renaming a product that is already being shared."

      # Second on the form, straight under the name. It used to sit last, about
      # 2,000px down a 2,700px form, so the one field most likely to be the
      # reason for opening a product was the one furthest from the top. The name
      # stays first because it is what the entry is called everywhere else.
      - label: "Photos"
        name: images
        widget: list
        label_singular: "Photo"
        collapsed: false
        summary: "{{fields.alt}}"
        hint: "First photo is the one on the card. The product page shows up to three — front, side and back work well."
        fields:
          - label: "Photo address"
            name: upload
            widget: string
            required: false
            hint: "Paste the photo's web address from your ImageKit library: open imagekit.io, click the photo, press Copy URL. It looks like https://ik.imagekit.io/lpdlhr/… — ImageKit then resizes it for phones automatically."
          - label: "…or another image link"
            name: url
            widget: string
            required: false
            hint: "A full https:// address from somewhere other than ImageKit. Only needed for a photo hosted elsewhere. If both boxes are filled in, this one wins."
          - label: "Photo description (alt text)"
            name: alt
            widget: string
            required: false
            hint: "Describe the piece for search engines and for anyone using a screen reader — e.g. \"Blush pink net party frock for girls, hand-beaded bodice\"."

      # The grid/tiles view (the toggle beside the list) draws its thumbnail
      # from one plain field on the entry and cannot look inside the Photos list
      # above — which is why the tiles would otherwise show empty. This field
      # copies the first Photos row into a shape the tiles view can read, and it
      # does that copying by itself, every time this piece is saved
      # (site/admin/tile-photo.js) — there is nothing to fill in here by hand,
      # and nothing here is shown on the website itself.
      - label: "Tile photo (filled in automatically)"
        name: image
        widget: string
        required: false
        hint: "Kept in sync with the first photo above every time you save. Edit Photos above to change it — this box is only what the grid view reads its thumbnail from."

      - label: "Subcategory"
        name: subcategory
        widget: relation
        collection: subcategories
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name, parent]
        hint: "Which section of the shop this appears in. Add or remove sections under Subcategories in the sidebar."

      - label: "Show on website"
        name: visible
        widget: boolean
        default: true
        hint: "Off = the piece disappears from the shop, keeping everything you have typed. Nothing is deleted."

      - label: "Badge"
        name: badge
        widget: select
        required: false
        default: ""
        options:
          - { label: "None", value: "" }
          - { label: "New", value: "New" }
          - { label: "Made to order", value: "Made to order" }
          - { label: "Sold out", value: "Sold out" }
        hint: "Optional corner label on the photo. \"Sold out\" keeps the piece visible but marks it clearly. There is no \"Sale\" option any more: a sale is created purely by filling in a size's sale price below, and the SALE label then appears by itself — on the card, on the product page, and on the Sale page. Clear the sale price and it all goes away together."

      - label: "Added on"
        name: addedOn
        widget: datetime
        default: "{{now}}"
        required: false
        hint: "Filled in for you when you add a piece. Newest pieces come first on the shop pages, and the ten newest of all fill the spinning ring on the home page. Change it only to move a piece up or down that order."

      - label: "Sizes and prices"
        name: sizes
        widget: list
        label_singular: "Size"
        # Collapsed, because the summary shows the price already: five expanded
        # rows push the Photos field ~2000px down the form.
        collapsed: true
        # A row on sale reads "4–6 years — PKR 18500 → 14000", so the discount
        # is visible without opening the row.
        summary: "{{fields.size}}  —  PKR {{fields.price}}{{fields.salePrice | ternary('  →  PKR ', '')}}{{fields.salePrice}}"
        hint: "One row per age band you make this in. The price on the website changes with the size the customer picks. Remove a row to stop offering that size."
        fields:
          - label: "Size"
            name: size
            widget: select
            options:
              - "0–3 years"
              - "4–6 years"
              - "7–9 years"
              - "10–12 years"
              - "13–16 years"
          - label: "Price (PKR)"
            name: price
            widget: number
            value_type: int
            min: 1
            hint: "Numbers only, no commas. 18500 shows as PKR 18,500."
          # Sale prices are per size, not per product, because the prices
          # themselves are: a piece can cost different amounts in different age
          # bands, and the page shows whichever size the customer has picked.
          # One sale price for the whole piece would have nothing to strike
          # through the moment they changed size.
          - label: "Sale price (PKR)"
            name: salePrice
            widget: number
            value_type: int
            required: false
            min: 1
            hint: "Leave blank for the normal price. Fill it in and the old price is shown above it with a line through it, and the customer pays this one. It must be lower than the price above, or it is ignored."
          - label: "Available"
            name: available
            widget: boolean
            default: true
            hint: "Off = this size is not offered right now."

      # Per piece rather than site-wide: the accessory suits a frock and not a
      # shirt, and one switch for the whole shop could not tell them apart. A
      # piece saved before this field existed has no value for it, which counts
      # as on — so nothing already in the catalogue changes until it is turned
      # off deliberately.
      - label: "Offer a matching accessory"
        name: showAccessory
        widget: boolean
        default: true
        hint: "Off = the \"Add matching accessory\" tick-box disappears from this product's page, and the total is just the price. Turn it off for pieces you do not make an accessory for."

      - label: "What the accessory is"
        name: accessoryName
        widget: string
        required: false
        hint: "e.g. \"hair bow\", \"matching clutch\", \"hijab pin\". Shown to the customer as \"Add matching hair bow\" instead of the plain \"Add matching accessory\", so they know exactly what they would be adding. Leave blank to keep the plain wording. Ignored when the switch above is off."

      - label: "Matching accessory price (PKR)"
        name: accessoryPrice
        widget: number
        value_type: int
        required: false
        default: 1500
        hint: "Added to the total when the customer ticks the accessory box above. Leave blank to use the site default. Ignored when the switch above is off."

      - label: "Description"
        name: description
        widget: text
        required: false
        hint: "Leave blank to use the subcategory's standard description. Fill it in when this piece deserves its own words — fabric, colour, trim."

      - label: "Second paragraph"
        name: description2
        widget: text
        required: false
        hint: "Optional. Also falls back to the subcategory."

      - label: "Details"
        name: specs
        widget: object
        collapsed: true
        hint: "Any field left blank uses the subcategory's standard text."
        fields:
          - { label: "Fabric", name: fabric, widget: string, required: false }
          - { label: "Occasion", name: occasion, widget: string, required: false }
          - { label: "Fit", name: fit, widget: string, required: false }
          - { label: "Care", name: care, widget: string, required: false }

  # ---------------------------------------------------------------------------
  # SUBCATEGORIES — the sections inside each tab
  # ---------------------------------------------------------------------------
  - name: subcategories
    label: Subcategories
    label_singular: Subcategory
    description: >
      The sections inside Girls, Boys, Babies and Ready to wear — "Casual
      dresses", "Rompers" and so on. Adding one here makes it available to pick
      on a product. Deleting one hides its products until you move them.
    folder: content/subcategories
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: name
    # The file name is the section's id — see the "Short code" note below. It is
    # built from the tab and the name so it reads for itself in a product's
    # form, and the CMS guarantees it is unique: if the name is already taken it
    # adds a number rather than overwriting. Set once, when the section is
    # created; renaming the section afterwards leaves it alone, which is what
    # keeps every product pointing at the right place.
    slug: "{{fields.parent}}-{{fields.name}}"
    summary: "{{name}}  ·  {{parent}}"
    sortable_fields: [parent, order, name]
    editor:
      preview: false
    view_groups:
      - label: "Tab"
        field: parent
    fields:
      # There is no "Short code" field any more, and that is deliberate. It used
      # to be typed by hand, and two girls sections were both given "g1" — after
      # which one of them showed no products and both wrote the same anchor into
      # the page, with nothing on screen to say so. The code is now the file
      # name, which the CMS keeps unique on its own.
      - label: "Name"
        name: name
        widget: string
        hint: "The heading shown above the grid, e.g. \"Casual dresses\". Safe to rename any time."

      - label: "Tab"
        name: parent
        widget: select
        options:
          - { label: "Girls", value: girls }
          - { label: "Boys", value: boys }
          - { label: "Babies", value: babies }
          - { label: "Ready to wear", value: ready }
        hint: "Which of the four shop tabs this section sits under."

      - label: "Sort order"
        name: order
        widget: number
        value_type: int
        default: 100
        hint: "Lower numbers appear higher up the page."

      - label: "Standard description"
        name: defaultDescription
        widget: text
        required: false
        hint: "Used by every product in this subcategory that does not have its own description. Write it once here rather than on each piece."

      - label: "Standard second paragraph"
        name: defaultDescription2
        widget: text
        required: false

      - label: "Standard details"
        name: defaultSpecs
        widget: object
        collapsed: true
        fields:
          - { label: "Fabric", name: fabric, widget: string, required: false }
          - { label: "Occasion", name: occasion, widget: string, required: false }
          - { label: "Fit", name: fit, widget: string, required: false }
          - { label: "Care", name: care, widget: string, required: false }

  # ---------------------------------------------------------------------------
  # CATEGORY PAGES — the copy at the top of each of the four tabs
  # ---------------------------------------------------------------------------
  - name: categories
    label: "Category pages"
    description: >
      The wording and card photo for each of the four shop tabs. The tabs
      themselves and their colours are fixed by the design.
    editor:
      preview: false
    files:
      - name: girls
        label: "Girls"
        file: content/categories/girls.json
        fields: &category_fields
          - { label: "Key", name: key, widget: hidden }
          - { label: "Tab label", name: label, widget: string, hint: "Shown in the navigation bar and footer." }
          - { label: "Page title", name: title, widget: string, hint: "Used in the breadcrumb trail." }
          - { label: "Eyebrow", name: eyebrow, widget: string, hint: "The small line above the heading, e.g. \"Made on order\"." }
          - { label: "Main heading", name: h1, widget: string }
          - { label: "Intro paragraph", name: blurb, widget: text }
          - { label: "Second paragraph", name: blurb2, widget: text, hint: "A good place for the words parents actually search for." }
          - { label: "Grid heading", name: catsHeading, widget: string, hint: "The uppercase line above the subcategory sections." }
          - label: "Home page card"
            name: card
            widget: object
            collapsed: false
            hint: "How this tab appears in the \"Get yours now\" row on the home page."
            fields:
              - { label: "Card subtitle", name: subtitle, widget: string }
              - label: "Card photo"
                name: image
                widget: object
                fields:
                  - { label: "Photo address", name: upload, widget: string, required: false, hint: "Paste from your ImageKit library (imagekit.io → click the photo → Copy URL)." }
                  - { label: "…or another image link", name: url, widget: string, required: false }
              - { label: "Photo description (alt text)", name: alt, widget: string }
          - label: "Search engine listing"
            name: seo
            widget: object
            collapsed: true
            fields:
              - { label: "Page title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
      - name: boys
        label: "Boys"
        file: content/categories/boys.json
        fields: *category_fields
      - name: babies
        label: "Babies"
        file: content/categories/babies.json
        fields: *category_fields
      - name: ready
        label: "Ready to wear"
        file: content/categories/ready.json
        fields: *category_fields

  # ---------------------------------------------------------------------------
  # SITE SETTINGS — three pages, one per job
  #
  # This was a single page holding everything from the phone number to the
  # footer line, which meant scrolling past the hero headlines to change an
  # email address. It is three files now, and the CMS shows one page per file.
  #
  # The split is only an admin-side arrangement: tools/content.js reads all
  # three and merges them into the one settings object the rest of the build
  # has always seen, so nothing about the site knows or cares which page a
  # value was typed on.
  #
  # Moving a setting from one page to another means moving it in BOTH places —
  # the field here and the key in the JSON file. A setting declared on two
  # pages is worse than one declared on none: each page saves the whole file it
  # owns, so the two copies drift and only one of them reaches the site. The
  # build warns by name if it ever finds the same key in two files.
  # ---------------------------------------------------------------------------
  - name: settings
    label: "Site settings"
    description: >
      Three pages. Contact details is the shop's phone number, email, social
      links and the whole contact page. Product defaults is the wording and
      prices every product falls back on. Site & home page is everything else —
      the hero, the carousel, the about section, the footer.
    editor:
      preview: false
    files:
      # --- 1. the shop's own details, and the page that shows them -----------
      - name: contact
        label: "Contact details"
        file: content/settings-contact.json
        description: >
          Phone number, email and social links, plus the wording on the contact
          page. Changing the WhatsApp number here changes it everywhere on the
          site — the floating button, every product page, the contact page.
        fields:
          - label: "WhatsApp number"
            name: whatsappNumber
            widget: string
            pattern: ['^[0-9]{8,15}$', "Digits only, with country code and no + or spaces — e.g. 923217152723"]
            hint: "Country code first, digits only. Used by every WhatsApp button on the site."
          - { label: "Phone number as shown", name: phoneDisplay, widget: string, hint: "How it reads on screen, e.g. +92 321 715 2723" }
          - { label: "Email", name: email, widget: string }
          - { label: "Instagram link", name: instagram, widget: string }
          - { label: "Facebook link", name: facebook, widget: string }
          - { label: "TikTok link", name: tiktok, widget: string }
          - { label: "Google Business link", name: google, widget: string, required: false, hint: "The link customers use to find you and leave a review on Google (from your Google Business Profile)." }
          - { label: "Google review link", name: googleReview, widget: string, required: false, hint: "Optional. The direct write-a-review link from your Google Business Profile (Ask for reviews, then copy the link — it looks like https://g.page/r/.../review). It opens the star box straight away. Leave blank and the contact page's review button uses the Google Business link above instead." }

          - label: "Contact page"
            name: contact
            widget: object
            collapsed: true
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Intro", name: intro, widget: text }
              - { label: "Steps eyebrow", name: stepsEyebrow, widget: string }
              - label: "Ordering steps"
                name: steps
                widget: list
                label_singular: "Step"
                collapsed: false
                summary: "{{fields.title}}"
                hint: "Numbered automatically. Three works best on phones."
                fields:
                  - { label: "Title", name: title, widget: string }
                  - { label: "Body", name: body, widget: text }
              - { label: "FAQ heading", name: faqHeading, widget: string }
              - label: "FAQs"
                name: faq
                widget: list
                label_singular: "Question"
                collapsed: true
                summary: "{{fields.question}}"
                hint: "These are also published as structured data, so Google can show them directly in search results."
                fields:
                  - { label: "Question", name: question, widget: string }
                  - { label: "Answer", name: answer, widget: text }
              - { label: "Social section heading", name: socialHeading, widget: string }
              - label: "Social cards"
                name: social
                widget: object
                collapsed: true
                hint: "The wording on each card. The links themselves come from the contact details above."
                fields:
                  - label: "Instagram"
                    name: instagram
                    widget: object
                    fields:
                      - { label: "Description", name: description, widget: string }
                      - { label: "Button label", name: button, widget: string }
                  - label: "WhatsApp"
                    name: whatsapp
                    widget: object
                    fields:
                      - { label: "Description", name: description, widget: string }
                      - { label: "Button label", name: button, widget: string }
                  - label: "Facebook"
                    name: facebook
                    widget: object
                    fields:
                      - { label: "Description", name: description, widget: string }
                      - { label: "Button label", name: button, widget: string }
                  - label: "TikTok"
                    name: tiktok
                    widget: object
                    fields:
                      - { label: "Description", name: description, widget: string }
                      - { label: "Button label", name: button, widget: string }
                  - label: "Google"
                    name: google
                    widget: object
                    fields:
                      - { label: "Description", name: description, widget: string }
                      - { label: "Button label", name: button, widget: string }
                  - label: "Email"
                    name: email
                    widget: object
                    fields:
                      - { label: "Description", name: description, widget: string }
                      - { label: "Button label", name: button, widget: string }
              - label: "Feedback block"
                name: feedback
                widget: object
                collapsed: true
                fields:
                  - { label: "Eyebrow", name: eyebrow, widget: string }
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Body", name: body, widget: text }
                  - { label: "Button label", name: button, widget: string, hint: "The button opens your Google review link — see Google review link near the top of this page." }
              - label: "Search engine listing"
                name: seo
                widget: object
                collapsed: true
                fields:
                  - { label: "Page title", name: title, widget: string }
                  - { label: "Description", name: description, widget: text }

      # --- 2. what a product says when it says nothing of its own ------------
      - name: products
        label: "Product defaults"
        file: content/settings-products.json
        description: >
          The wording and prices every product falls back on. A piece uses its
          own words first, then its subcategory's, then these — so nothing here
          shows anywhere a piece has been filled in properly, and nothing on the
          site can end up blank.
        fields:

          - label: "Prices and totals"
            name: accessoryPriceDefault
            widget: number
            value_type: int
            hint: "Default matching-accessory charge, used when a product does not set its own."
          - { label: "Accessory checkbox label", name: accessoryLabel, widget: string }
          - { label: "Accessory note", name: accessoryNote, widget: string }
          - { label: "Delivery note", name: deliveryNote, widget: string, hint: "The small print under the total on a product page." }
          - label: "Size chart link"
            name: sizeChartUrl
            widget: string
            required: false
            hint: "Web address of the size chart PDF, opened by the Size Chart button on every product page. Upload the PDF to ImageKit the same way you upload photos, copy its address and paste it here. Leave this blank and the button disappears from every product page."

          - label: "Default product wording"
            name: productDefaults
            widget: object
            collapsed: true
            hint: >
              The last fallback for product wording. A piece uses its own words
              first, then its subcategory's standard wording, then these. Filling
              these in means no product can end up with a blank description or an
              empty details row, however it was added.
            fields:
              - { label: "Description", name: description, widget: text, required: false }
              - { label: "Second paragraph", name: description2, widget: text, required: false }
              - label: "Closing sentence"
                name: summaryTail
                widget: string
                required: false
                hint: "Ends the one-line summary shown in Google results and WhatsApp previews, after the first sentence of the description."
              - label: "Details"
                name: specs
                widget: object
                collapsed: true
                fields:
                  - { label: "Fabric", name: fabric, widget: string, required: false }
                  - { label: "Occasion", name: occasion, widget: string, required: false }
                  - { label: "Fit", name: fit, widget: string, required: false }
                  - { label: "Care", name: care, widget: string, required: false }

      # --- 3. everything about the site itself -------------------------------
      - name: site
        label: "Site & home page"
        file: content/settings.json
        description: >
          The business name, the home page — hero, features, banner, about, the
          spinning carousel, the category row — and the footer.
        fields:
          - { label: "Business name", name: brandName, widget: string }
          - { label: "Tagline", name: tagline, widget: string }

          - label: "Home page — search engine listing"
            name: seo
            widget: object
            collapsed: true
            fields:
              - { label: "Page title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }

          - label: "Hero headlines"
            name: heroHooks
            widget: list
            label_singular: "Headline"
            collapsed: false
            summary: "{{fields.text}}"
            hint: "The three hand-lettered lines that fade in as the drawing turns into a dress. Exactly three."
            fields:
              - { label: "Line", name: text, widget: string }

          - label: "Hero buttons"
            name: heroCtas
            widget: list
            label_singular: "Button"
            collapsed: false
            summary: "{{fields.title}}"
            hint: "The three cards under the hero. Their links are fixed: collection, WhatsApp, contact page."
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Subtitle", name: subtitle, widget: string, hint: "Hidden on phones to save space." }

          - { label: "Features heading", name: featuresHeading, widget: string }
          - label: "Features"
            name: features
            widget: list
            label_singular: "Feature"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - label: "Icon"
                name: icon
                widget: select
                options:
                  - { label: "Gift box", value: gift }
                  - { label: "Globe", value: globe }
                  - { label: "Crown", value: crown }
                  - { label: "Dress", value: dress }
              - { label: "Title", name: title, widget: string }
              - { label: "Body", name: body, widget: text }

          - label: "Banner"
            name: quote
            widget: object
            collapsed: true
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Subline", name: subline, widget: text, hint: "Wrap words in **double asterisks** to make them bold." }

          - label: "About us"
            name: about
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow", name: eyebrow, widget: string }
              - { label: "Heading", name: heading, widget: string }
              - { label: "Body", name: body, widget: text, hint: "Leave a blank line between paragraphs. **Double asterisks** make text bold." }
              - label: "Photo"
                name: photo
                widget: object
                fields:
                  - { label: "Photo address", name: upload, widget: string, required: false, hint: "Paste from your ImageKit library (imagekit.io → click the photo → Copy URL)." }
                  - { label: "…or another image link", name: url, widget: string, required: false }
                  - { label: "Photo description (alt text)", name: alt, widget: string }

          # --- The spinning ring on the home page ------------------------
          # The wording above it, how it is filled, and how many faces it has.
          - { label: "Carousel heading", name: carouselHeading, widget: string }
          - { label: "Carousel hint", name: carouselHint, widget: string }

          - label: "How the carousel is filled"
            name: carouselMode
            widget: select
            default: latest
            options:
              - { label: "The newest pieces, automatically", value: latest }
              - { label: "Only the pieces I choose below", value: chosen }
            hint: >
              Left on "newest", the ring keeps itself up to date — whatever you
              added last is what spins. Switch to "pieces I choose" to put
              exactly what you want in it, however old.

          - label: "Number of slots"
            name: carouselSlots
            widget: number
            value_type: int
            default: 10
            min: 3
            max: 20
            required: false
            hint: >
              How many pieces the ring spins. Ten is the shape it was designed
              around; fewer makes each piece bigger, more makes them narrower.
              Anything outside 3–20 is pulled back into that range.

          # A relation field stores the piece's web address (its "slug"), which
          # is what content.js looks it up by. Renaming a product changes that
          # address, so a rename drops it out of the ring — the build says so
          # by name when it happens, and the piece is picked again here.
          - label: "Pieces in the carousel"
            name: carouselProducts
            widget: list
            label_singular: "Piece"
            collapsed: false
            required: false
            hint: >
              Used only when "How the carousel is filled" is set to the pieces
              you choose. They spin in the order listed — drag to reorder. Start
              typing a product name to find it. Leave this empty and the newest
              pieces show instead, so the home page is never left blank.
            field:
              label: "Piece"
              name: product
              widget: relation
              collection: products
              value_field: "{{slug}}"
              search_fields: [name]
              display_fields: [name]
              required: false

          - { label: "Categories row heading", name: categoriesHeading, widget: string }

          - { label: "Footer line", name: footerNote, widget: string }
          - { label: "Floating button label", name: floatingLabel, widget: string }

      # --- 4. the Sale page's own wording ------------------------------------
      # Which pieces appear on /sale/ is not set here and cannot be: a piece is
      # on sale when one of its sizes has a sale price, and nothing else. This
      # page is only the words around them.
      - name: sale
        label: "Sale page"
        file: content/settings-sale.json
        description: >
          The wording on the Sale page. Which pieces appear there is decided by
          the pieces themselves — fill in a size's sale price and it appears,
          clear it and it goes. Nothing on this page changes that.
        fields:
          - { label: "Eyebrow", name: eyebrow, widget: string, hint: "The small line above the heading." }
          - { label: "Heading", name: h1, widget: string }
          - { label: "Intro", name: blurb, widget: text, hint: "Leave a blank line between paragraphs to split them." }
          - label: "When nothing is on sale"
            name: empty
            widget: string
            hint: "The single line the page shows when no piece has a sale price. A link back to the collection — to the first shop tab (Girls) — is added under it automatically."
          - label: "Search engine listing"
            name: seo
            widget: object
            collapsed: true
            fields:
              - { label: "Page title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
