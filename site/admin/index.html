<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Little Princess Designer — Admin</title>
<link rel="icon" href="/assets/logo-crown.png">
<!-- Self-hosted brand fonts, for the loading screen below only. Sveltia's own
     UI does not read this — do NOT add a stylesheet link for the CMS itself,
     which is a common mistake carried over from Decap. -->
<link rel="stylesheet" href="/tokens.css">
<style>
  /* The loading screen, shown until Sveltia paints. Sveltia's UI cannot be
     re-skinned (it is built in Svelte, not React, and ships its own themed
     interface with automatic dark mode), so this is the only branded surface
     in the admin now. Everything past the login screen is Sveltia's own look. */
  :root{
    --lp-berry:var(--berry-700,#A43462);
    --lp-paper:var(--paper-050,#FFFCF8);
    --lp-ink:var(--ink-800,#333530);
  }
  html,body{margin:0}
  body{background:var(--lp-paper);font-family:"Nunito","Segoe UI",system-ui,sans-serif}
  #lp-boot{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:var(--lp-paper);z-index:9999;text-align:center;padding:24px;
  }
  #lp-boot img{height:64px;width:auto}
  #lp-boot p{font:700 15px/1.5 "Nunito",sans-serif;color:var(--lp-ink);margin:0;max-width:34ch}
  #lp-boot small{font:400 13px/1.5 "Nunito",sans-serif;color:#6B6D68;max-width:44ch}
  #lp-boot[hidden]{display:none}
</style>
</head>
<body>

<div id="lp-boot">
  <img src="/assets/logo-lockup.webp" alt="Little Princess Designer">
  <p>Opening the admin…</p>
  <small id="lp-boot-note">
    If this does not move past this screen, the sign-in service may not be set
    up yet — see <code>docs/CMS-SETUP.md</code>.
  </small>
</div>

<!-- Sveltia CMS — the drop-in successor to Decap CMS. It reads the same
     admin/config.yml.

     Pinned deliberately. Sveltia is pre-1.0 and releases often; a floating
     version re-downloads whatever is newest on every visit, so a bad release
     upstream could break this admin overnight with no change on our side.
     Upgrade by bumping this number and checking the admin still loads and
     saves. Releases: https://github.com/sveltia/sveltia-cms/releases

     Do NOT add type="module" — the pre-built file below is not an ES module,
     and adding it stops the CMS loading. -->
<script src="https://unpkg.com/@sveltia/cms@0.203.1/dist/sveltia-cms.js"></script>

<!-- Copies a product's first photo into the plain field the grid view reads
     its thumbnail from, on every save — see the file for why. Uses Sveltia's
     preSave event (the same API Decap exposed). -->
<script src="/admin/tile-photo.js"></script>

<!-- Keeps the mouse wheel from changing a number field's value out from under
     whoever is scrolling past it — see the file for why. Plain browser code,
     independent of the CMS. -->
<script src="/admin/no-scroll-number.js"></script>

<script>
  // Hide the loading screen once Sveltia has painted something — its login
  // screen included, so the Login button is never sitting behind the overlay.
  (function () {
    var boot = document.getElementById("lp-boot");
    var hide = function () { if (boot) boot.hidden = true; };

    // Sveltia mounts into a custom element. Poll briefly for it, then give up
    // and hide the splash regardless so it can never sit there forever.
    var tries = 0;
    var check = setInterval(function () {
      var mounted = document.querySelector("#nc-root, .sveltia-cms, sveltia-cms");
      if ((mounted && mounted.firstElementChild) || ++tries > 60) {
        clearInterval(check);
        hide();
      }
    }, 120);
    setTimeout(function () { clearInterval(check); hide(); }, 8000);
  })();
</script>
</body>
</html>
