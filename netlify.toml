# Netlify build configuration.
# The site is generated into dist/ from content/ + site/ on every push.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The admin is a single-page app; every path under it must serve its shell.
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# /index.html is reachable on its own and self-canonicalizes to "/", but
# there is no reason to let a crawler fetch both — send it straight to "/".
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Applies to every path. The other [[headers]] blocks below add more headers
# for their own more specific paths; Netlify merges blocks by header name
# rather than one block replacing another.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Long-lived caching for fingerprint-free assets is unsafe, so keep HTML fresh
# and let the images cache hard.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
