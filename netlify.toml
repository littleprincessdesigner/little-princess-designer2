# Netlify build configuration.
# The site is generated into dist/ from content/ + site/ on every push.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The admin is a single-page app; every path under it must serve its shell.
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# /index.html is reachable on its own and self-canonicalizes to "/", but
# there is no reason to let a crawler fetch both — send it straight to "/".
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# The favicon <link> tags point at /assets/, but crawlers (Google's included)
# still probe the root /favicon.ico by convention, and a 404 there is a missed
# signal for the icon shown next to the site in search results. Serve the real
# file from the root path too (200, not a redirect, so the bytes come back
# directly).
[[redirects]]
  from = "/favicon.ico"
  to = "/assets/favicon.ico"
  status = 200

# Applies to every path. The other [[headers]] blocks below add more headers
# for their own more specific paths; Netlify merges blocks by header name
# rather than one block replacing another.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Report-Only: the browser evaluates this and would log violations to its
    # own devtools console, but nothing is actually blocked — there is no
    # report-collection endpoint wired up for anyone to review those logs, so
    # this is a safe first step, not real protection yet. Written for the
    # public pages' own resource use (self-hosted CSS/JS/fonts, ImageKit
    # photos, no forms); the admin panel at /admin/* loads a wider set of
    # third-party resources (unpkg for the Sveltia CMS script, api.github.com,
    # and the OAuth sign-in host) this policy was not tuned for, but
    # Report-Only can't break anything there either, so it inherits the same
    # header rather than needing its own.
    # Switch to a real Content-Security-Policy only after confirming (via a
    # report-collection endpoint, or manually checking devtools on every
    # page type) that nothing legitimate would be blocked.
    Content-Security-Policy-Report-Only = "default-src 'self'; img-src 'self' https://ik.imagekit.io; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Long-lived caching for fingerprint-free assets is unsafe, so keep HTML fresh
# and let the images cache hard.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# styles.css/tokens.css/app.js/carousel-3d.js aren't fingerprinted, so they
# can't safely get the immutable 1-year treatment /assets/* gets — a deploy
# that changes them needs visitors to pick up the new copy. An hour is short
# enough that a change reaches a returning visitor the same day, long enough
# that it isn't refetched on every single page view.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
