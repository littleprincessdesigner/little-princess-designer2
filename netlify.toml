# Netlify build configuration.
# The site is generated into dist/ from content/ + site/ on every push.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The admin is a single-page app; every path under it must serve its shell.
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# /index.html is reachable on its own and self-canonicalizes to "/", but
# there is no reason to let a crawler fetch both — send it straight to "/".
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# The favicon <link> tags point at /assets/, but crawlers (Google's included)
# still probe the root /favicon.ico by convention, and a 404 there is a missed
# signal for the icon shown next to the site in search results. Serve the real
# file from the root path too (200, not a redirect, so the bytes come back
# directly).
[[redirects]]
  from = "/favicon.ico"
  to = "/assets/favicon.ico"
  status = 200

# Applies to every path. The other [[headers]] blocks below add more headers
# for their own more specific paths; Netlify merges blocks by header name
# rather than one block replacing another.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Enforced, not Report-Only: the browser actually blocks anything this
    # policy does not name. It is written for what the public pages really
    # load — this site's own CSS and JS, photographs from ImageKit, and the
    # Google Analytics tag — and nothing else. There is deliberately no
    # 'unsafe-inline' in script-src: the one inline script the site had (the
    # GA setup) is served from /ga.js instead, so a script injected into a CMS
    # field has nowhere to run. The only other <script> blocks on a page are
    # `type="application/ld+json"` structured data, which CSP does not gate.
    #   img-src      ImageKit for photographs, plus Google's pixel fallbacks
    #   connect-src  where GA4 sends the beacon (region1.google-analytics.com
    #                is why that host is wildcarded)
    #   style-src    'unsafe-inline' stays: the hero uses style="opacity:0"
    #                attributes and the <noscript><style> block in head()
    # The admin at /admin/* needs far more than this — see its own block at the
    # bottom of this file, which overrides this header for those paths.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' https://ik.imagekit.io https://www.googletagmanager.com https://*.google-analytics.com; style-src 'self' 'unsafe-inline'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; font-src 'self'"

# Long-lived caching for fingerprint-free assets is unsafe, so keep HTML fresh
# and let the images cache hard.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# styles.css/tokens.css/app.js/carousel-3d.js aren't fingerprinted, so they
# can't safely get the immutable 1-year treatment /assets/* gets — a deploy
# that changes them needs visitors to pick up the new copy. An hour is short
# enough that a change reaches a returning visitor the same day, long enough
# that it isn't refetched on every single page view.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# The admin is the one place that deliberately gets a loose policy. It loads
# the Sveltia CMS bundle from unpkg, signs in through GitHub's OAuth host,
# talks to api.github.com, and boots itself from an inline script — none of
# which the public policy allows. Locking it down would buy nothing: it is
# behind a GitHub login and noindexed, while the public pages are the part of
# the site a stranger can reach. This header shares a name with the one on
# /*, and Netlify lets the more specific path win — the same behaviour this
# file already relies on for Cache-Control on /assets/* and /*.css.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data: https:"
